name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-ninja-release
            build_args: ""
            test_config_args: ""
          - os: macos-latest
            preset: macos-ninja-release
            build_args: ""
            test_config_args: ""
          - os: windows-latest
            preset: windows-vs2022
            build_args: "--config Release"
            test_config_args: "-C Release"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} ${{ matrix.build_args }} --parallel

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} ${{ matrix.test_config_args }} --output-on-failure

      - name: CLI smoke (info)
        run: >
          ./build/${{ matrix.preset }}/spoke_cli info
          || ./build/${{ matrix.preset }}/Release/spoke_cli.exe info
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spoke-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/spoke_cli*
            build/${{ matrix.preset }}/libspoke*
            build/${{ matrix.preset }}/spoke.dll
            build/${{ matrix.preset }}/Release/spoke_cli.exe
            build/${{ matrix.preset }}/Release/spoke.dll
