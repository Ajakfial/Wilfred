org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Maven Central / Google Maven rate-limit shared CI runner IPs (HTTP 429).
# Retry artifact downloads a few more times, with a longer exponential
# backoff, before failing the build.
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
