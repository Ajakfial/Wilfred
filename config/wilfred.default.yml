# Wilfred default configuration
# Copy to the user config directory and edit. Invalid values produce
# human-readable errors at startup instead of crashing.

search:
  include_system_files: false
  include_hidden_files: true
  show_system_in_results: false
  max_results: 40
  debounce_ms: 12
  web_search_fallback: true
  treat_urls_as_open: true
  min_query_length: 1
  fuzzy: true
  acronyms: true
  context_aware: true
  clipboard: true
  minis: true
  macros: true
  snippets: true
  plugins: true

index:
  # Empty paths means platform defaults (home, applications, common data).
  paths: []
  exclude:
    - node_modules
    - .git
    - .svn
    - .hg
    - __pycache__
    - .cache
    - Cache
    - caches
    - CMakeFiles
    - .Trash
    - $Recycle.Bin
    - System Volume Information
  exclude_globs:
    - "*.tmp"
    - "*.swp"
    - "*~"
  system_directories: []
  follow_symlinks: false
  index_hidden: true
  index_system: false
  usn_scan: true
  max_file_size_bytes: 0
  content_indexing: true
  content_max_bytes: 131072
  content_max_tokens: 480
  workers: 0
  cpu_percent_limit: 45
  memory_limit_mb: 384
  batch_size: 2048
  debounce_fs_ms: 80
  rescan_interval_seconds: 0
  persist_every_records: 50000
  wal_compact_bytes: 8388608

  extensions:
    include: []
    exclude:
      - .tmp
      - .temp
      - .part
      - .crdownload
      - .bak
      - .cache

ranking:
  exact_name: 1200
  prefix_name: 700
  substring_name: 420
  fuzzy_name: 280
  acronym: 640
  path_component: 180
  extension: 90
  application: 350
  recency: 220
  frequency: 260
  previous_selection: 400
  word_boundary: 160
  token_proximity: 140
  directory_bonus: 40
  alias: 500
  learned_choice: 520
  context_parent: 200
  context_extension: 90
  access_recency: 150
  clipboard_overlap: 240
  content_hit: 190
  hour_affinity: 70

aliases:
  browser: default-browser
  code: Visual Studio Code
  vscode: Visual Studio Code
  explorer: file-manager

macros:
  yt: "https://www.youtube.com/results?search_query={query}"
  gh: "https://github.com/search?q={query}"
  # Placeholders: {query} {query_enc} {clipboard} {clipboard_enc}
  # Bang form: !yt cats   or   yt:cats

# Named directory groups referenced as `scope:projects` in queries.
scopes:
  home: []

# Optional extra key/value tags consumed by plugins or custom rankers.
custom_metadata: {}

history:
  enabled: true
  max_entries: 8000
  persist: true

clipboard:
  manager: true
  max_entries: 200
  persist: true

hotkey:
  enabled: true
  modifiers:
    - ctrl
    - alt
  # On macOS, ctrl is mapped to Command for the default binding.
  key: W
  use_command_on_macos: true

# Extra system-wide hotkeys, fired from any app. Each binding runs one action:
# `show` toggles the overlay, `macro:<text>` opens a macro/quicklink URL
# (clipboard feeds {clipboard} placeholders), `system:<id>` runs a session
# command (lock, sleep, ...), `media:<id>` presses a media key,
# `workflow:<name>` runs a named workflow against the clipboard (use
# targetless steps; file steps fail gracefully per step).
#hotkeys:
#  google-clip:
#    modifiers: [ctrl, alt]
#    key: G
#    run: macro:gclip

browser:
  provider: auto
  search_template: "https://www.google.com/search?q={query}"
  library: true

logging:
  level: info
  file: ""
  max_file_bytes: 2097152

ui:
  theme: dark
  max_visible: 9
  width: 720

plugins:
  enabled: true
  directories: []
  timeout_ms: 400
  # Optional registry index (JSON) for `wilfred plugin list/install`.
  # Empty = disabled; no network calls unless set.
  registry: ""
  # Trust-on-first-use: new/changed plugins show as `plugins` approval
  # cards and are skipped until `wilfred plugin approve <id>`.
  require_approval: true

providers:
  semantic: false
  semantic_min_score: 0.3
  # trigram | vector | hybrid. `hybrid` merges HNSW vectors + trigram fallback.
  semantic_backend: hybrid
  semantic_max_results: 10

# Local embedding for semantic search. Works offline via the built-in hash
# embedder; point at llama.cpp for higher quality:
#   1) Run: llama-server -m <model.gguf> --embedding --port 8080
#   2) Set embedding.endpoint: "http://127.0.0.1:8080/embedding"
# Or set embedding.model to a local .gguf path (used when a libllama build
# is present at runtime, otherwise hash fallback keeps search working).
embedding:
  enabled: false
  backend: auto
  model: ""
  endpoint: ""
  dim: 384
  min_score: 0.45
  max_results: 10

# Optional AI assistant. Disabled until you add a key. Supports OpenAI,
# Anthropic, Gemini, and Groq (all OpenAI-compatible except endpoint shapes).
# Query from the overlay with `ai <question>` or `ask <question>`.
ai:
  enabled: false
  provider: auto
  model: ""
  api_key: ""
  endpoint: ""
  max_tokens: 1024
  temperature: 0.7
  timeout_ms: 30000

# Calendar / contacts / notes sources + OCR indexing.
sources:
  calendar: true
  contacts: true
  notes: true
  calendar_paths: []
  contacts_paths: []
  notes_paths: []
  # OCR needs the `tesseract` CLI on PATH; images are OCRed during indexing.
  ocr: false
  ocr_languages: "eng"
  max_results: 8

# Optional remote search backends (opt-in only, off by default).
# Each source is a GET template; {query} / {query_enc} are substituted.
# The endpoint returns {"results":[{"title":"..","subtitle":"..","url":".."}]}.
# No calls are made unless enabled: true AND at least one source is listed.
remotes:
  enabled: false
  timeout_ms: 5000
  max_results: 8
  sources: []
  # Example:
  # sources:
  #   - name: wiki
  #     url: "https://wiki.example.com/api/search?q={query_enc}"
  #     max_results: 5
  #     headers:
  #       Authorization: "Bearer <token>"

# Saved window layouts + tiling (desktop only).
layouts:
  # Auto-apply a layout when the monitor set changes (daemon polls).
  auto_apply: false
  # Fallback layout when no monitor_layouts entry matches.
  auto_layout: ""
  # Monitor-signature substring -> layout (`wilfred status` never prints
  # signatures; enable debug logging to see them on change).
  monitor_layouts: {}

# On-demand speech-to-text for audio files (`transcribe ...`).
# Needs the `whisper-cli` binary (whisper.cpp) on PATH; `ffmpeg` is only
# needed to extract audio from containers (mp4/m4a/...). WAV files need
# neither ffmpeg nor conversion.
transcription:
  enabled: true
  # Explicit whisper binary path or command name (empty probes PATH for
  # `whisper-cli`, then `whisper`).
  binary: ""
  # Explicit whisper model file (.bin). Empty probes <data>/models for a
  # ggml model. Download one, e.g. ggml-base.en.bin, from
  # huggingface.co/ggerganov/whisper.cpp.
  model: ""
  # Language hint for whisper (`en`, `de`, ...). `auto` leaves detection
  # to the model.
  language: "auto"
  # Write `<audio>.txt` next to the source on success (transcript also
  # goes to the clipboard).
  save_txt: true
  # Microphone device for `dictate` (ffmpeg syntax for this OS). Empty means
  # the OS default.
  mic: ""

api:
  enabled: false
  bind: 127.0.0.1
  port: 17380
  token: ""

sync:
  enabled: false
  url: ""
  token: ""
  interval_seconds: 0
  include_index: true

snippets:
  expansion: true
  prefix: ";"
  auto_paste: false
  # Global abbreviations in any app (Windows hook today; overlay paste
  # everywhere). Triggers expand on trailing delimiter.
  global_expansion: false
  items: {}
  # Snippet placeholders: {date} {time} {datetime} {year} {month} {day}
  #   {clipboard} {query}. Folders: set `folder:` per snippet in snippets.yml
  #   and filter with `;folder/name` or `snip folder/name`.

# Named multi-step workflows: each workflow is an ordered list of result
# actions run in order (see actions: open, reveal, copy_path, copy_text...).
# Query with `workflow <name>` or `run <name>`, chain with '+' already works
# ad-hoc (e.g. action id "copy_path+reveal").
workflows:
  review: [copy_path, reveal]
  # docs_review:
  #   steps: [copy_path, reveal]

# Parameterized quicklinks: name -> URL/path/command template.
# Placeholders: {query} {query_enc} {clipboard} {clipboard_enc}
# plus positional {1} {2} ... and {*} (all args).
# Query with `ql <name> <args>` or as a macro (`!name args`, `name:args`).
quicklinks:
  # docs: "https://example.com/search?q={query}"
  # ticket: "https://example.com/t/{1}"

# Per-app extra context actions: app-name substring (case-insensitive)
# -> additional action ids appended to file/app results for that app.
# Example: always offer terminal/editor actions on VS Code results.
app_actions:
  code: [open_terminal, open_editor, copy_path]
  # photoshop: [reveal]
