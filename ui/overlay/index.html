<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14161d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Wilfred — fast cross-platform launcher (Windows, macOS, Linux)" />
    <title>Wilfred</title>
    <style>
      /* Inline critical paint: never flash white while style.css loads.
         All hosts (WebView2 / WKWebView / WebKitGTK) start transparent. */
      html, body { background: transparent !important; }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/app.bundle.js"></script>
  </body>
</html>
