name: Website

on:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'plugins/registry.json'
      - 'plugins/dist/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stage plugin gallery
        # The marketplace page fetches plugins/registry.json at runtime and
        # links per-platform zips; both are staged here (gitignored locally —
        # use `npm run prebuild` equivalent below before previewing).
        run: |
          mkdir -p public/plugins
          cp ../plugins/registry.json public/plugins/registry.json
          cp ../plugins/dist/*.zip public/plugins/ 2>/dev/null || echo "no published zips yet"

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
