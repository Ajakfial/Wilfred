name: Tests

# Runs the unit tests on every PR, plus the overlay typecheck/bundle check.
# BSD coverage stays on the nightly workflow (VM runners are slow); the
# release workflow builds every platform on tags.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Test ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
          - os: ubuntu-latest
            id: linux-x64
          - os: macos-latest
            id: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build + test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Config Release -Tests

      - name: Build + test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/build-linux.sh --release --tests

      - name: Build + test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./scripts/build-macos.sh --release --tests

  overlay:
    name: Overlay UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/overlay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      - name: Bundle is committed
        # The C++ build ships dist/ verbatim, so a TS change without a
        # rebuilt bundle would silently not take effect. Fail loudly.
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::ui/overlay/dist/ is stale — run 'npm run build' in ui/overlay and commit it."
            exit 1
          fi
