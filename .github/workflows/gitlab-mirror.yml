
name: GitLab Mirror

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Sync GitHub to GitLab
    runs-on: ubuntu-latest

    steps:
    - name: Mirror repository
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_USERNAME: ${{ secrets.GITLABUSER }}
          GL_TOKEN: ${{ secrets.WRITE_GITLAB_REPOSITORY }}

      run: |
        set -e

        echo "Cloning GitHub repository..."

        git clone --mirror \
        "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
        mirror.git

        cd mirror.git

        echo "Fetching latest GitHub changes..."

        git fetch -p origin

        echo "Pushing mirror to GitLab..."

        AUTH=$(printf '%s:%s' "$GL_USERNAME" "$GL_TOKEN" | base64 -w0)

        GL_URL="https://gitlab.com/gakifdezel/WilfredLauncher.git"

        # Plain (non-force) pushes: GitLab protects main against force
        # pushes, which is what `push --mirror` always attempts. Hidden
        # GitHub refs (refs/pull/*) are not pushed either.
        echo "Pushing branches..."
        git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
        push "$GL_URL" 'refs/heads/*:refs/heads/*'

        # Tags that already exist on GitLab pointing elsewhere cannot be
        # moved without force; warn instead of failing the whole sync.
        echo "Pushing tags..."
        git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
        push "$GL_URL" 'refs/tags/*:refs/tags/*' \
        || echo "::warning::Some tags were rejected by GitLab (already exist with a different commit or are protected)"

        echo "GitLab synchronization completed successfully!"
