
name: Repository Mirroring

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Sync GitHub to GitLab and Codeberg
    runs-on: ubuntu-latest

    steps:
    - name: Mirror repositories
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GL_USERNAME: ${{ secrets.GITLABUSER }}
          GL_TOKEN: ${{ secrets.WRITE_GITLAB_REPOSITORY }}

          CB_USERNAME: fzdtestacc
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

      run: |
        set -e

        echo "Cloning GitHub repository..."

        git clone --mirror \
        "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
        mirror.git

        cd mirror.git

        echo "Fetching latest changes..."
        git fetch -p origin

        echo "Pushing to GitLab..."

        GL_AUTH=$(printf '%s:%s' "$GL_USERNAME" "$GL_TOKEN" | base64 -w0)

        git -c http.extraheader="AUTHORIZATION: Basic $GL_AUTH" \
        push --mirror \
        "https://gitlab.com/gakifdezel/WilfredLauncher.git"

        echo "Pushing to Codeberg..."

        CB_AUTH=$(printf '%s:%s' "$CB_USERNAME" "$CB_TOKEN" | base64 -w0)

        git -c http.extraheader="AUTHORIZATION: Basic $CB_AUTH" \
        push --mirror \
        "https://codeberg.org/fzdtestacc/Wilfred.git"

        echo "All mirrors synchronized successfully!"
