
name: Codeberg Mirror

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Sync GitHub to Codeberg
    runs-on: ubuntu-latest

    steps:
    - name: Mirror repository
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CB_USERNAME: fzdtestacc
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

      run: |
        set -e

        echo "Cloning GitHub repository..."

        git clone --mirror \
        "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
        mirror.git

        cd mirror.git

        echo "Fetching latest changes..."

        git fetch -p origin

        echo "Pushing to Codeberg..."

        CB_AUTH=$(printf '%s:%s' "$CB_USERNAME" "$CB_TOKEN" | base64 -w0)

        git -c http.extraheader="AUTHORIZATION: Basic $CB_AUTH" \
        push --mirror \
        "https://codeberg.org/fzdtestacc/Wilfred.git"

        echo "Codeberg synchronization completed successfully!"
