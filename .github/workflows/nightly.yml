name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
          - os: ubuntu-latest
            id: linux-x64
          - os: macos-latest
            id: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build + test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Config Release -Tests

      - name: Build + test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/build-linux.sh --release --tests

      - name: Build + test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./scripts/build-macos.sh --release --tests

      - name: Stage nightly archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path 'build\windows' -Recurse -Filter 'wilfred.exe' |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Select-Object -First 1
          if (-not $bin) { throw 'Could not find wilfred.exe' }
          $staging = "dist\wilfred-nightly-${{ matrix.id }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\ui" | Out-Null
          Copy-Item $bin.FullName $staging
          Copy-Item -Recurse 'ui\overlay' "$staging\ui\overlay"
          Copy-Item 'README.md' $staging -ErrorAction SilentlyContinue
          Copy-Item 'config\wilfred.default.yml' $staging -ErrorAction SilentlyContinue
          Compress-Archive -Path $staging -DestinationPath "dist\wilfred-nightly-${{ matrix.id }}.zip" -Force

      - name: Stage nightly archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ID="${{ matrix.id }}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ROOT=build/linux
          else
            ROOT=build/macos
          fi
          BIN="$(find "${ROOT}" -maxdepth 2 -type f -name wilfred -not -path '*/CMakeFiles/*' | head -n 1)"
          if [[ -z "${BIN}" || ! -f "${BIN}" ]]; then
            echo "Could not find wilfred binary" >&2
            find build -name 'wilfred*' || true
            exit 1
          fi
          STAGING="dist/wilfred-nightly-${ID}"
          mkdir -p "${STAGING}/ui"
          cp "${BIN}" "${STAGING}/"
          cp -R ui/overlay "${STAGING}/ui/overlay"
          cp README.md "${STAGING}/" || true
          cp config/wilfred.default.yml "${STAGING}/" || true
          tar -C dist -czf "dist/wilfred-nightly-${ID}.tar.gz" "wilfred-nightly-${ID}"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: wilfred-nightly-${{ matrix.id }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  bsd:
    name: Build freebsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No hosted BSD runners: run the build inside a FreeBSD VM.
      # Build + tests only here; the release workflow packages the
      # freebsd-x64 tarball separately (see docs/bsd.md).
      - name: Build + test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          run: |
            pkg install -y cmake ninja pkgconf shells/bash
            bash ./scripts/build-bsd.sh --release --tests

  openbsd:
    name: Build openbsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same shape as bsd above; OpenBSD packages come via pkg_add.
      - name: Build + test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          copyback: false
          run: |
            pkg_add cmake ninja pkgconf bash
            bash ./scripts/build-bsd.sh --release --tests

  netbsd:
    name: Build netbsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same shape as bsd above. The netbsd-vm image has no pkgin preinstalled
      # and a minimal PATH: pkg_add(1) from base + an explicit PKG_PATH for
      # binary packages (pkgsrc uses amd64, not x86_64, in the path).
      - name: Build + test on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          copyback: false
          run: |
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
            if command -v pkgin >/dev/null 2>&1; then
              pkgin -y install cmake ninja pkgconf bash
              for cc in gcc15 gcc14 gcc13 gcc12 clang; do
                if pkgin -y install "$cc"; then break; fi
              done
            else
              arch="$(uname -m)"; [ "$arch" = x86_64 ] && arch=amd64
              rel="$(uname -r | cut -d. -f1-2)"
              export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/${arch}/${rel}/All/"
              pkg_add cmake ninja pkgconf bash
              for cc in gcc15 gcc14 gcc13 gcc12 clang; do
                if pkg_add "$cc"; then break; fi
              done
            fi
            # pkgsrc gcc lands in a versioned dir off PATH: probe and export.
            for c in /usr/pkg/gcc*/bin/gcc /usr/pkg/bin/gcc /usr/bin/gcc /usr/bin/cc /usr/pkg/bin/clang /usr/bin/clang; do
              if [ -x "$c" ]; then export CC="$c"; break; fi
            done
            for c in /usr/pkg/gcc*/bin/g++ /usr/pkg/bin/g++ /usr/bin/g++ /usr/bin/c++ /usr/pkg/bin/clang++ /usr/bin/clang++; do
              if [ -x "$c" ]; then export CXX="$c"; break; fi
            done
            { [ -n "${CC:-}" ] && [ -n "${CXX:-}" ]; } || { echo "no C compiler" >&2; exit 1; }
            echo "CC=$CC CXX=$CXX"
            "$CC" --version | head -n 1
            bash ./scripts/build-bsd.sh --release --tests
