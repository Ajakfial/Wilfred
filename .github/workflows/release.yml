name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-x64
          - os: ubuntu-latest
            id: linux-x64
          - os: macos-latest
            id: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Config Release -Tests

      - name: Sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WILFRED_PFX_PASSWORD: ${{ secrets.WILFRED_PFX_PASSWORD }}
          WILFRED_PFX_BASE64: ${{ secrets.WILFRED_PFX_BASE64 }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          $bin = Get-ChildItem -Path 'build\windows' -Recurse -Filter 'wilfred.exe' |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Select-Object -First 1
          if (-not $bin) { throw 'Could not find wilfred.exe' }
          Write-Host "Found $($bin.FullName)"
          # Publisher identity is always stamped via VERSIONINFO
          # (CompanyName Wilfred Open Contributors). Authenticode trust
          # needs a Microsoft-trusted signature; see docs/signing.md.
          $signed = $false
          if ($env:WILFRED_PFX_BASE64) {
            Write-Host 'PFX secret present: signing with OV/EV certificate.'
            $pfx = 'build\windows\release-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WILFRED_PFX_BASE64))
            ./scripts/Sign-WindowsBinary.ps1 -ExePath $bin.FullName -PfxPath $pfx
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            $signed = $true
          } elseif ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and ($env:AZURE_TRUSTED_SIGNING_ENDPOINT -or ($env:AZURE_TRUSTED_SIGNING_ACCOUNT -and $env:AZURE_TRUSTED_SIGNING_PROFILE))) {
            Write-Host 'Azure Trusted Signing secrets present: signing with Microsoft-trusted timestamp.'
            ./scripts/Sign-WindowsBinary.ps1 -ExePath $bin.FullName
            $signed = $true
          } else {
            Write-Host '::warning::No signing secrets (WILFRED_PFX_BASE64 or Azure Trusted Signing). Shipping with VERSIONINFO publisher stamp only; SmartScreen will still warn until trusted signing is configured. See docs/signing.md.'
          }
          if ($signed) {
            ./scripts/Sign-WindowsBinary.ps1 -ExePath $bin.FullName -VerifyOnly
          }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/build-linux.sh --release --tests

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./scripts/build-macos.sh --release --tests

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $id = '${{ matrix.id }}'
          $bin = Get-ChildItem -Path 'build\windows' -Recurse -Filter 'wilfred.exe' |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Select-Object -First 1
          if (-not $bin) { throw 'Could not find wilfred.exe' }
          $staging = "dist\wilfred-$tag-$id"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\ui" | Out-Null
          Copy-Item $bin.FullName $staging
          Copy-Item -Recurse 'ui\overlay' "$staging\ui\overlay"
          Copy-Item 'README.md' $staging -ErrorAction SilentlyContinue
          Copy-Item 'config\wilfred.default.yml' $staging -ErrorAction SilentlyContinue
          Compress-Archive -Path $staging -DestinationPath "dist\wilfred-$tag-$id.zip" -Force

      - name: MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WILFRED_PFX_PASSWORD: ${{ secrets.WILFRED_PFX_PASSWORD }}
          WILFRED_PFX_BASE64: ${{ secrets.WILFRED_PFX_BASE64 }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $id = '${{ matrix.id }}'
          $staging = "dist\wilfred-$tag-$id"
          if (-not (Test-Path "$staging\wilfred.exe")) { throw "Staging dir not found: $staging" }
          $msi = "dist\wilfred-$tag-$id.msi"
          ./scripts/Build-Msi.ps1 -Staging $staging -Out $msi -Version $tag
          # An unsigned MSI installs fine but SmartScreen still warns; sign it
          # with the same identity as the exe when secrets are present.
          $signed = $false
          if ($env:WILFRED_PFX_BASE64) {
            $pfx = 'build\windows\msi-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WILFRED_PFX_BASE64))
            ./scripts/Sign-WindowsBinary.ps1 -ExePath $msi -PfxPath $pfx
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            $signed = $true
          } elseif ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and ($env:AZURE_TRUSTED_SIGNING_ENDPOINT -or ($env:AZURE_TRUSTED_SIGNING_ACCOUNT -and $env:AZURE_TRUSTED_SIGNING_PROFILE))) {
            ./scripts/Sign-WindowsBinary.ps1 -ExePath $msi
            $signed = $true
          } else {
            Write-Host '::warning::No signing secrets; shipping unsigned MSI (installs fine, SmartScreen still warns). See docs/signing.md.'
          }
          if ($signed) {
            ./scripts/Sign-WindowsBinary.ps1 -ExePath $msi -VerifyOnly
          }

      - name: Choco (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $id = '${{ matrix.id }}'
          $staging = "dist\wilfred-$tag-$id"
          if (-not (Test-Path "$staging\wilfred.exe")) { throw "Staging dir not found: $staging" }
          ./scripts/Build-Choco.ps1 -Staging $staging -OutDir dist -Version $tag
          # Push to the Chocolatey community feed only when configured;
          # the .nupkg is still attached to the GitHub Release either way.
          # A failed push (bad key, or the wilfred id owned by someone else)
          # must not fail the release: warn and continue.
          if ($env:CHOCO_API_KEY) {
            $nupkg = Get-ChildItem -Path 'dist' -Filter 'wilfred.*.nupkg' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $nupkg) { throw 'Chocolatey package not produced.' }
            # A failed push must not fail the release: tolerate the native
            # non-zero exit first (the runner aborts on it otherwise), then warn.
            $prevEap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --no-progress
            $pushRc = $LASTEXITCODE
            $ErrorActionPreference = $prevEap
            if ($pushRc -ne 0) {
              Write-Host '::warning::Community push failed. 403 usually means a bad key or the wilfred id owned by another account (check community.chocolatey.org/packages/wilfred); rename the nuspec id if so. The nupkg is still attached to the GitHub Release.'
            }
          } else {
            Write-Host '::warning::No CHOCO_API_KEY secret; skipping community push (nupkg still attached to release).'
          }
          # The tolerated push above leaves a non-zero LASTEXITCODE behind,
          # which the runner would fail the step on. The nupkg is built and
          # will be attached, so this step always succeeds from here.
          exit 0

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ID="${{ matrix.id }}"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            ROOT=build/linux
          else
            ROOT=build/macos
          fi
          BIN="$(find "${ROOT}" -maxdepth 2 -type f -name wilfred -not -path '*/CMakeFiles/*' | head -n 1)"
          if [[ -z "${BIN}" || ! -f "${BIN}" ]]; then
            echo "Could not find wilfred binary" >&2
            find build -name 'wilfred*' || true
            exit 1
          fi
          STAGING="dist/wilfred-${TAG}-${ID}"
          mkdir -p "${STAGING}/ui"
          cp "${BIN}" "${STAGING}/"
          cp -R ui/overlay "${STAGING}/ui/overlay"
          cp README.md "${STAGING}/" || true
          cp config/wilfred.default.yml "${STAGING}/" || true
          tar -C dist -czf "dist/wilfred-${TAG}-${ID}.tar.gz" "wilfred-${TAG}-${ID}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wilfred-${{ github.ref_name }}-${{ matrix.id }}
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.nupkg
            dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Build android
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          cd /tmp
          curl -fsSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "${SDK_ROOT}/cmdline-tools/latest"
          unzip -q -o commandlinetools-linux-11076708_latest.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          rm -f commandlinetools-linux-11076708_latest.zip
          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/26.3.11579264"
          } >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          # GITHUB_PATH only takes effect in later steps; export inline
          # for the version check below.
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          sdkmanager --version

      - name: Install Android packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/android/wilfred-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/wilfred-release.jks" >> "${GITHUB_ENV}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; shipping unsigned APK/AAB (install requires a signed build). See docs/android.md."
          fi

      - name: Derive version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v1.2.3 / v1.2.3-beta1 -> 1.2.3
          VER="${TAG#v}"
          VER="${VER%%-*}"
          echo "WILFRED_VERSION_NAME=${VER}" >> "${GITHUB_ENV}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VER}.0.0.0"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH%%[^0-9]*}"
          PATCH="${PATCH:-0}"
          CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          if [[ "${CODE}" -lt 1 ]]; then CODE=1; fi
          echo "WILFRED_VERSION_CODE=${CODE}" >> "${GITHUB_ENV}"
          echo "Tag ${TAG} -> versionName=${VER} versionCode=${CODE}"

      - name: Build APK + AAB (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./scripts/build-android.sh --release --apk --bundle 2>&1 | tee "${GITHUB_WORKSPACE}/android-build.log"
          echo "APK:"
          find android/app/build/outputs/apk -name '*.apk' || true
          echo "AAB:"
          find android/app/build/outputs/bundle -name '*.aab' || true

      - name: Surface Kotlin errors
        if: failure()
        run: |
          LOG="${GITHUB_WORKSPACE}/android-build.log"
          if [[ -f "${LOG}" ]]; then
            echo "--- Kotlin compiler errors ---"
            grep -E "^e: |error: " "${LOG}" | head -n 60 || true
            echo "--- end ---"
          else
            echo "No android-build.log captured."
          fi

      - name: Verify signature
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1 || true)"
          if [[ -z "${APK}" ]]; then
            echo "No release APK found" >&2
            find android/app/build/outputs -name '*.apk' || true
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "${ANDROID_SDK_ROOT}/build-tools/"* | sort -V | tail -n 1)"
          if "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}"; then
            echo "APK signature verified."
            echo "WILFRED_APK_SIGNED=true" >> "${GITHUB_ENV}"
          else
            # No keystore secrets -> unsigned output. Not a failure: forks
            # stay green; the artifact is suffixed -unsigned below.
            echo "::warning::APK is unsigned (no keystore secrets). See docs/android.md."
            echo "WILFRED_APK_SIGNED=false" >> "${GITHUB_ENV}"
          fi
          exit 0

      - name: Stage artifacts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1 || true)"
          if [[ "${WILFRED_APK_SIGNED:-false}" == "true" ]]; then
            cp "${APK}" "dist/wilfred-${TAG}-android.apk"
          else
            cp "${APK}" "dist/wilfred-${TAG}-android-unsigned.apk"
          fi
          if [[ -n "${AAB}" && -f "${AAB}" ]]; then
            if [[ "${WILFRED_APK_SIGNED:-false}" == "true" ]]; then
              cp "${AAB}" "dist/wilfred-${TAG}-android.aab"
            else
              cp "${AAB}" "dist/wilfred-${TAG}-android-unsigned.aab"
            fi
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wilfred-${{ github.ref_name }}-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.zip artifacts/*.msi artifacts/*.nupkg artifacts/*.tar.gz artifacts/*.apk artifacts/*.aab)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found" >&2
            find artifacts -type f || true
            exit 1
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Wilfred ${TAG}" \
              --generate-notes \
              --verify-tag
          fi
